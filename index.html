<title>WorkRadar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed navy sidebar + scrolling work area; one ranked radar is the centre of gravity, calendar and people beside it. */
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --subtle:#F1F4F9; --border:#E3E8EF; --fg:#0F172A; --muted:#5B6478; --faint:#8A93A6;
  --side:#0B1B3F; --side-fg:#AEBBD6; --side-hover:#132A5C; --side-strong:#FFFFFF;
  --accent:#2454E6; --accent-hover:#1D44BF; --accent-tint:#EAF0FE; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(16,24,40,.06); --shadow-pop:0 12px 28px rgba(16,24,40,.16); --scrim:rgba(15,23,42,.38);
  --p1-fg:#B42318; --p1-bg:#FEE4E2; --p1-edge:#D92D20;
  --p2-fg:#C4320A; --p2-bg:#FFE6D5;
  --p3-fg:#475467; --p3-bg:#F2F4F7;
  --ns-dot:#98A2B3; --ns-fg:#475467; --ns-bg:#F2F4F7;
  --ip-dot:#2E90FA; --ip-fg:#175CD3; --ip-bg:#EFF8FF;
  --pe-dot:#EAAA08; --pe-fg:#854A0E; --pe-bg:#FEF7C3;
  --bl-dot:#DD2590; --bl-fg:#C11574; --bl-bg:#FDF2FA;
  --as-dot:#15B79E; --as-fg:#107569; --as-bg:#F0FDF9;
  --sc-dot:#6172F3; --sc-fg:#3538CD; --sc-bg:#EEF4FF;
  --sn-dot:#7A5AF8; --sn-fg:#5925DC; --sn-bg:#F4F3FF;
  --dn-dot:#17B26A; --dn-fg:#067647; --dn-bg:#ECFDF3;
  --ov-dot:#F38744; --ov-fg:#C4320A; --ov-bg:#FFE6D5;
  --ev-team:#2454E6; --ev-one:#15B79E; --ev-cust:#F79009; --ev-rev:#7A5AF8; --ev-req:#EAAA08; --ev-free:#17B26A;
  --warn-bg:#FFFAEB; --warn-border:#FEDF89; --warn-fg:#93370D;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r-chip:6px; --r-ctl:8px; --r-card:12px; --r-pop:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#111A2E; --subtle:#17223A; --border:#24314D; --fg:#E6EAF2; --muted:#9AA6BD; --faint:#6F7B93;
  --side:#080F1F; --side-fg:#9AA6BD; --side-hover:#15213D; --side-strong:#FFFFFF;
  --accent:#4C7DFF; --accent-hover:#6B93FF; --accent-tint:#1A2A55; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-pop:0 12px 28px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55);
  --p1-fg:#FDA29B; --p1-bg:rgba(217,45,32,.20); --p1-edge:#F04438;
  --p2-fg:#F7B27A; --p2-bg:rgba(247,144,9,.17);
  --p3-fg:#CBD2DC; --p3-bg:rgba(152,162,179,.15);
  --ns-fg:#CBD2DC; --ns-bg:rgba(152,162,179,.15);
  --ip-fg:#84CAFF; --ip-bg:rgba(46,144,250,.17);
  --pe-fg:#FDE272; --pe-bg:rgba(234,170,8,.16);
  --bl-fg:#FAA7E0; --bl-bg:rgba(221,37,144,.19);
  --as-fg:#5FE9D0; --as-bg:rgba(21,183,158,.16);
  --sc-fg:#A4BCFD; --sc-bg:rgba(97,114,243,.19);
  --sn-fg:#BDB4FE; --sn-bg:rgba(122,90,248,.19);
  --dn-fg:#75E0A7; --dn-bg:rgba(23,178,106,.16);
  --ov-fg:#F7B27A; --ov-bg:rgba(243,135,68,.17);
  --warn-bg:rgba(234,170,8,.12); --warn-border:rgba(234,170,8,.4); --warn-fg:#FDE272;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#111A2E; --subtle:#17223A; --border:#24314D; --fg:#E6EAF2; --muted:#9AA6BD; --faint:#6F7B93;
  --side:#080F1F; --side-fg:#9AA6BD; --side-hover:#15213D; --side-strong:#FFFFFF;
  --accent:#4C7DFF; --accent-hover:#6B93FF; --accent-tint:#1A2A55; --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-pop:0 12px 28px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55);
  --p1-fg:#FDA29B; --p1-bg:rgba(217,45,32,.20); --p1-edge:#F04438;
  --p2-fg:#F7B27A; --p2-bg:rgba(247,144,9,.17);
  --p3-fg:#CBD2DC; --p3-bg:rgba(152,162,179,.15);
  --ns-fg:#CBD2DC; --ns-bg:rgba(152,162,179,.15);
  --ip-fg:#84CAFF; --ip-bg:rgba(46,144,250,.17);
  --pe-fg:#FDE272; --pe-bg:rgba(234,170,8,.16);
  --bl-fg:#FAA7E0; --bl-bg:rgba(221,37,144,.19);
  --as-fg:#5FE9D0; --as-bg:rgba(21,183,158,.16);
  --sc-fg:#A4BCFD; --sc-bg:rgba(97,114,243,.19);
  --sn-fg:#BDB4FE; --sn-bg:rgba(122,90,248,.19);
  --dn-fg:#75E0A7; --dn-bg:rgba(23,178,106,.16);
  --ov-fg:#F7B27A; --ov-bg:rgba(243,135,68,.17);
  --warn-bg:rgba(234,170,8,.12); --warn-border:rgba(234,170,8,.4); --warn-fg:#FDE272;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;gap:2px;padding:20px 14px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 22px;color:var(--side-strong);font-weight:700;font-size:18px;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-ctl);color:var(--side-fg);font-weight:500;border:0;background:none;width:100%;text-align:left;min-height:40px}
.nav:hover{background:var(--side-hover);color:var(--side-strong);text-decoration:none}
.nav.on{background:var(--accent);color:var(--on-accent)}
.nav .badge{margin-left:auto;font-size:11px;font-weight:600;background:rgba(255,255,255,.14);color:var(--side-strong);padding:1px 8px;border-radius:10px}
.nav.on .badge{background:rgba(255,255,255,.25)}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding:14px 10px 0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.side-foot .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.src-row{display:flex;justify-content:space-between;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;min-height:64px;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top h1{font-size:20px;margin:0;font-weight:600;letter-spacing:-.01em;margin-right:auto}
.search{position:relative;flex:0 1 340px;min-width:180px}
.search input{width:100%;height:40px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-ctl);padding:0 52px 0 36px}
.search .ic{position:absolute;left:11px;top:11px;color:var(--faint)}
.kbd{position:absolute;right:8px;top:9px;font-size:11px;border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--muted);background:var(--subtle)}
.results{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-pop);padding:6px;z-index:40;max-height:360px;overflow:auto}
.results button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:var(--r-ctl)}
.results button:hover,.results button.hl{background:var(--subtle)}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-ctl);position:relative;color:var(--fg)}
.icon-btn:hover{background:var(--subtle)}
.icon-btn .cnt{position:absolute;top:-5px;right:-5px;background:var(--p1-edge);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;line-height:16px}
.me{display:flex;align-items:center;gap:8px;font-size:13px}
.me b{display:block;font-weight:600;line-height:1.2}
.content{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:1480px;width:100%}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-card);background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn-fg)}
.banner b{font-weight:600}
.banner .sp{margin-left:auto;display:flex;gap:8px}

/* primitives */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h h2{font-size:16px;margin:0;font-weight:600}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:14px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--border);background:var(--surface);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--subtle)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:30px;padding:0 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:var(--r-chip);white-space:nowrap;line-height:20px}
.chip.p1{color:var(--p1-fg);background:var(--p1-bg)} .chip.p2{color:var(--p2-fg);background:var(--p2-bg)} .chip.p3{color:var(--p3-fg);background:var(--p3-bg)}
.chip.type{color:var(--ns-fg);background:var(--subtle);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:1px 9px 1px 8px;border-radius:999px;white-space:nowrap;line-height:20px}
.pill i{width:7px;height:7px;border-radius:50%;display:inline-block}
.s-ns{color:var(--ns-fg);background:var(--ns-bg)} .s-ns i{background:var(--ns-dot)}
.s-ip{color:var(--ip-fg);background:var(--ip-bg)} .s-ip i{background:var(--ip-dot)}
.s-pe{color:var(--pe-fg);background:var(--pe-bg)} .s-pe i{background:var(--pe-dot)}
.s-bl{color:var(--bl-fg);background:var(--bl-bg)} .s-bl i{background:var(--bl-dot)}
.s-as{color:var(--as-fg);background:var(--as-bg)} .s-as i{background:var(--as-dot)}
.s-sc{color:var(--sc-fg);background:var(--sc-bg)} .s-sc i{background:var(--sc-dot)}
.s-sn{color:var(--sn-fg);background:var(--sn-bg)} .s-sn i{background:var(--sn-dot)}
.s-dn{color:var(--dn-fg);background:var(--dn-bg)} .s-dn i{background:var(--dn-dot)}
.s-ov{color:var(--ov-fg);background:var(--ov-bg)} .s-ov i{background:var(--ov-dot)}
.src{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.logo{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font:700 9px var(--font);color:#fff;flex:none}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none;position:relative;letter-spacing:.02em}
.av .pres{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface)}
.stack{display:inline-flex}
.stack .av{border:2px solid var(--surface);margin-left:-8px} .stack .av:first-child{margin-left:0}
.overline{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;background:var(--subtle);border:1px solid var(--border);border-radius:var(--r-ctl);padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg .n{font-size:11px;color:var(--faint)}
select.f, input.f{height:36px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-ctl);padding:0 10px;font-size:13px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:44px 20px}
.empty h3{margin:0;font-size:18px;font-weight:600}
.empty p{margin:0;color:var(--muted);max-width:420px}
.ic-circle{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* dashboard */
.hello h2{font-size:26px;margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.hello p{margin:4px 0 0;color:var(--muted)}
.brief{background:var(--accent-tint);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);border-radius:var(--r-card);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.brief-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brief-h h2{margin:0;font-size:16px;font-weight:600}
.brief-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.brief-grid p{margin:4px 0 0;font-size:14px;line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:14px 16px;display:flex;gap:12px;align-items:center;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);text-align:left;width:100%}
.kpi:hover{border-color:var(--accent)}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .d{font-size:12px;color:var(--faint)}
.statusbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--subtle)}
.statusbar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.grid-main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

/* radar rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto auto;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--border);position:relative;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--subtle)}
.row.p1::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--p1-edge)}
.rank{font-family:var(--mono);font-size:12px;color:var(--faint)}
.r-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.r-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.r-title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.r-meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
.r-why b{color:var(--accent);font-weight:600}
.r-age{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:34px;text-align:right}
.acts{display:flex;gap:4px}
.radar-table .row{grid-template-columns:22px 28px minmax(0,1fr) 150px 92px 116px 44px auto}
.radar-head{display:grid;grid-template-columns:22px 28px minmax(0,1fr) 150px 92px 116px 44px 214px;gap:14px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--subtle);font-size:12px;font-weight:600;color:var(--muted);border-radius:var(--r-card) var(--r-card) 0 0}
.chk{width:16px;height:16px;accent-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:2px 4px 2px 10px}
.fchip button{border:0;background:var(--subtle);border-radius:50%;width:18px;height:18px;line-height:16px;padding:0;font-size:12px}
.bulk{display:flex;gap:8px;align-items:center;padding:10px 18px;background:var(--accent-tint);border-bottom:1px solid var(--border);flex-wrap:wrap}
.more-row{padding:12px 18px;border-top:1px solid var(--border)}

/* side widgets */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal .dow{font-size:11px;font-weight:600;color:var(--faint);padding:4px 0}
.day{position:relative;border:0;background:none;padding:6px 0 10px;border-radius:var(--r-ctl);font-size:13px;font-variant-numeric:tabular-nums;min-height:40px}
.day:hover{background:var(--subtle)}
.day.out{color:var(--faint);opacity:.55}
.day.today .dn{box-shadow:0 0 0 2px var(--accent);border-radius:50%}
.day.sel .dn{background:var(--accent);color:var(--on-accent);border-radius:50%}
.day .dn{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center}
.day .dots{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:center;gap:3px}
.day .dots i{width:5px;height:5px;border-radius:50%}
.day .dots .more{font-size:8px;line-height:5px;color:var(--muted);font-style:normal}
.pop{position:fixed;z-index:60;width:300px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-pop);padding:12px 14px;font-size:13px}
.pop h4{margin:0 0 8px;font-size:13px;font-weight:600}
.ev{display:grid;grid-template-columns:4px 46px minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--border)}
.ev:first-of-type{border-top:0}
.ev .bar{width:4px;align-self:stretch;border-radius:2px}
.ev .t{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ev.req .bar{background:none;border-left:2px dashed var(--ev-req)}
.agenda{display:flex;flex-direction:column;gap:6px;margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.agenda .a{display:flex;gap:10px;align-items:center;font-size:13px}
.agenda .a .t{font-family:var(--mono);font-size:12px;color:var(--muted);width:44px}
.free{color:var(--dn-fg);background:var(--dn-bg);border:1px solid color-mix(in srgb,var(--dn-dot) 40%,transparent);border-radius:6px;padding:0 6px;font-size:12px;font-weight:600}
.person{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}

.pulse{display:flex;flex-wrap:wrap;gap:22px}
.pulse .g{display:flex;flex-direction:column;gap:8px}

.cal-big .day .evs span i{width:6px;height:6px;border-radius:50%;flex:none}
.cal-big{gap:6px}

/* team */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{padding:12px 14px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r-card);text-align:left;box-shadow:var(--shadow)}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.mcard{padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.mcard.h-blocked{background:var(--bl-bg);border-color:color-mix(in srgb,var(--bl-dot) 30%,var(--border))}
.mcard.h-atrisk{background:color-mix(in srgb,var(--pe-bg) 55%,var(--surface))}
.prog{height:6px;border-radius:3px;background:var(--subtle);overflow:hidden}
.prog span{display:block;height:100%;border-radius:3px}

.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:52px 32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--border)}
.tl-i:first-child{border-top:0}
.tl-ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center}

.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.icard{display:flex;flex-direction:column}

.toggle{position:relative;width:38px;height:22px;flex:none}
.toggle input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;inset:0;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:11px;background:var(--border);transition:background .15s}
.toggle span::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}

.drawer-b{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:20px;flex:1}
.drawer-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}

.modal{position:fixed;z-index:90;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));background:var(--surface);border-radius:var(--r-pop);box-shadow:var(--shadow-pop);border:1px solid var(--border);max-height:86vh;overflow:auto}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-h h3{margin:0;font-size:16px;font-weight:600}
.modal-b{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.quote{border-left:3px solid var(--border);padding:8px 12px;background:var(--subtle);border-radius:0 8px 8px 0}
.menu{position:fixed;z-index:95;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-pop);padding:6px;min-width:220px}

function buildItems(){
  return RAW.map(r => {
    const [id,type,src,ref,title,from,owner,people,team,status,ageH,due,sender,tag,impact,impactLbl,conf,snippet,channel] = r;
    return {id,type,src,ref,title,from,owner,people,team,status,ageH,due,sender,tag,impact,impactLbl,conf,snippet,channel,
      closedToday: ['done','assigned','scheduled'].includes(status), url: SRC[src].url(ref), snoozeUntil: status==='snoozed' ? 'Wed 28 Oct, 09:00' : null};
  });
}
function scoreParts(it){
  return {T:TPTS[it.type], U:UPTS[it.due], S:SPTS[it.sender] + (it.tag?5:0), W:wpts(it.ageH), I:IPTS[it.impact]};
}
function score(it){ const p = scoreParts(it); let s = Math.min(100, p.T+p.U+p.S+p.W+p.I); return s; }
function band(it){ const s = score(it); let b = s >= 70 ? 'P1' : s >= 40 ? 'P2' : 'P3'; if (it.conf==='low' && b==='P1') b = 'P2'; return b; }
function why(it){
  const p = scoreParts(it);
  const lbl = {T:TLBL[it.type], U:ULBL[it.due], S:it.tag && SPTS[it.sender]===0 ? '@pm tag' : SLBL[it.sender], W:wlbl(it.ageH), I:it.impactLbl};
  const reasons = Object.entries(p).filter(([k,v]) => k!=='T' && v>0 && lbl[k]).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>lbl[k]);
  return (reasons.length ? reasons : [lbl.T]).join(' · ');
}

  const seen = new Set(); return ev.filter(e => { const key=e.t+e.s; if (seen.has(key)) return false; seen.add(key); return true; }).sort((a,b)=>a.s-b.s);
}
function freeSlots(d, from=540){
  const ev = eventsFor(d); const out = []; let cur = Math.max(540, from);
  for (const e of ev){ if (e.s - cur >= 30) out.push([cur, e.s]); cur = Math.max(cur, e.e); }
  if (1080 - cur >= 30) out.push([cur, 1080]);
  return out.map(([s,e]) => [Math.ceil(s/30)*30, e]).filter(([s,e]) => e-s >= 30);
}
function nextFree(){
  for (let i=0;i<7;i++){ const d = new Date(NOW); d.setDate(d.getDate()+i); const from = i===0 ? NOW.getHours()*60+NOW.getMinutes()+25 : 540;
    const f = freeSlots(d, from); if (f.length && d.getDay()%6) return {d, s:f[0][0], len:f[0][1]-f[0][0]}; }
  return null;
}
function nextFreeAfter(offsetDays){
  const d = new Date(NOW); d.setDate(d.getDate()+offsetDays); while (d.getDay()%6===0) d.setDate(d.getDate()+1);
  const f = freeSlots(d, offsetDays===0 ? 630 : 540); return f.length ? `${DOW[d.getDay()]} ${hm(f[0][0])}` : `${DOW[d.getDay()]} 17:30`;
}

async function aiBrief(){

function dayList(d){
  const ev = eventsFor(d); const free = freeSlots(d, dkey(d)===TODAY_KEY ? 600 : 540);

  const rows = [...ev.map(e=>({s:e.s, h:`<div class="ev"><span class="bar" style="background:${EVT[e.k]}"></span><span class="t">${hm(e.s)}</span><span><b style="font-weight:500">${esc(e.t)}</b><span style="display:block;margin-top:3px">${stack(e.ppl,20)}</span></span></div>`})),
    ...free.map(([s,e])=>({s, h:`<div class="ev"><span class="bar" style="background:var(--ev-free);opacity:.5"></span><span class="t">${hm(s)}</span><span><span class="free">Free · ${e-s} min</span></span></div>`}))].sort((a,b)=>a.s-b.s);
  return rows.map(r=>r.h).join('') + (dkey(d)==='2026-10-29' ? `<div class="ev req"><span class="bar"></span><span class="t">—</span><span>Design sync requested by Sneha <button class="btn sm" data-act="copySlot" data-slot="Thu 11:30" style="margin-top:4px">${ic('copy','sm')}Copy free slot 11:30</button></span></div>` : '');
}

function calPopover(anchor, k){

  const r = anchor.getBoundingClientRect(); const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.max(12, Math.min(window.innerWidth - w - 12, r.left + r.width/2 - w/2)) + 'px';

/* ---------- actions ---------- */
const nowT = () => { const d = new Date(); return hm(Math.min(1439, Math.max(NOW.getHours()*60+NOW.getMinutes()+ (S.log.length%40), d.getHours()*60+d.getMinutes()) % 1440)); };
function setStatus(id, status, extra={}, logText, act){
  const it = S.items.find(i=>i.id===id); if (!it) return;
  const prev = {status:it.status, owner:it.owner, closedToday:it.closedToday, snoozeUntil:it.snoozeUntil};
  Object.assign(it, {status, closedToday:['done','assigned','scheduled'].includes(status)}, extra);
  const entry = {t:nowT(), act, id, text:logText};
  S.log.unshift(entry); S.undo = {id, prev, entry};
  S.radar.sel = S.radar.sel.filter(x=>x!==id);
  persist(); render(); if (drawerId===id) renderDrawer(id);
  toast(logText, true);
}
function undo(){
  const u = S.undo; if (!u) return; const it = S.items.find(i=>i.id===u.id); if (!it) return;
  Object.assign(it, u.prev); S.log = S.log.filter(l=>l!==u.entry); S.undo = null; persist(); render(); if (drawerId===u.id) renderDrawer(u.id);
  toast('Undone · item is back on your radar');
}
function restore(id){
  const it = S.items.find(i=>i.id===id); if (!it) return;
  const orig = RAW.find(r=>r[0]===id); const back = orig && OPEN.includes(orig[9]) ? orig[9] : 'notstarted';
  Object.assign(it, {status:back, closedToday:false, snoozeUntil:null, owner: orig ? orig[6] : it.owner});
  S.log.unshift({t:nowT(), act:'restored', id, text:`Restored "${it.title}" to the radar`});
  persist(); render(); if (drawerId===id) renderDrawer(id); toast('Restored to your radar');
}
function toast(msg, withUndo=false){
  const box = document.getElementById('toasts'); const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `${ic('check','sm')}<span>${esc(msg)}${withUndo?' <span class="sub">· saved in WorkRadar only</span>':''}</span>${withUndo?'<button data-act="undo">Undo</button>':''}`;
  box.appendChild(el); setTimeout(() => el.remove(), withUndo ? 10000 : 4000);
  while (box.children.length > 3) box.firstChild.remove();
}
async function copy(text, okMsg){

function cycleTheme(){ const order = ['system','light','dark']; setTheme(order[(order.indexOf(S.theme)+1)%3]); }
function setTheme(v){ S.theme = v; store.set('theme', v); applyTheme(); render(); toast(`Theme: ${v[0].toUpperCase()+v.slice(1)}`); }
function applyTheme(){ const r = document.documentElement; if (S.theme==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!e.target.closest('.menu') && !(t && /Menu$/.test(t.dataset.act))) document.querySelectorAll('.menu').forEach(m=>m.remove());
  if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (e.target.closest('[data-stop]') && t.dataset.act==='open') return;
  switch(a){
    case 'open': lastFocus = t; renderDrawer(id); break;
    case 'close': closeLayer(); break;
    case 'closeModal': layer.querySelectorAll('.modal, .scrim[data-act="closeModal"]').forEach(x=>x.remove()); if (!drawerId) closeLayer(); break;
    case 'source': e.stopPropagation(); sourceModal(id); break;
    case 'done': { const it = S.items.find(i=>i.id===id); setStatus(id,'done',{},`Marked done "${it.title}"`,'done'); break; }
    case 'snoozeMenu': e.stopPropagation(); snoozeMenu(t, id); break;
    case 'snooze': { const it = S.items.find(i=>i.id===id); document.querySelectorAll('.menu').forEach(m=>m.remove()); setStatus(id,'snoozed',{snoozeUntil:t.dataset.until},`Snoozed "${it.title}" until ${t.dataset.until}`,'snoozed'); break; }
    case 'assignMenu': e.stopPropagation(); assignMenu(t, id); break;
    case 'assign': { const it = S.items.find(i=>i.id===id); document.querySelectorAll('.menu').forEach(m=>m.remove()); setStatus(id,'assigned',{owner:t.dataset.pid},`Assigned "${it.title}" to ${PEOPLE[t.dataset.pid].name}`,'assigned'); break; }
    case 'schedule': { const it = S.items.find(i=>i.id===id); setStatus(id,'scheduled',{},`Scheduled "${it.title}" for ${t.dataset.slot}`,'scheduled'); break; }
    case 'restore': restore(id); break;
    case 'undo': undo(); t.closest('.toast')?.remove(); break;
    case 'sel': { const s = S.radar.sel; S.radar.sel = t.checked ? [...s,id] : s.filter(x=>x!==id); render(); break; }
    case 'bulkDone': { const ids = S.radar.sel.slice(); ids.forEach(x=>{ const it=S.items.find(i=>i.id===x); Object.assign(it,{status:'done',closedToday:true}); S.log.unshift({t:nowT(),act:'done',id:x,text:`Marked done "${it.title}"`}); }); S.radar.sel=[]; persist(); render(); toast(`${ids.length} items marked done · restore them from the Activity Log`); break; }
    case 'bulkSnooze': { const ids = S.radar.sel.slice(); ids.forEach(x=>{ const it=S.items.find(i=>i.id===x); Object.assign(it,{status:'snoozed',closedToday:false,snoozeUntil:'Wed 28 Oct, 09:00'}); S.log.unshift({t:nowT(),act:'snoozed',id:x,text:`Snoozed "${it.title}" until tomorrow 09:00`}); }); S.radar.sel=[]; persist(); render(); toast(`${ids.length} items snoozed until tomorrow`); break; }
    case 'bulkClear': S.radar.sel = []; render(); break;
    case 'rtab': S.radar.tab = t.dataset.v; render(); break;
    case 'toggleP3': S.radar.showP3 = !S.radar.showP3; render(); break;
    case 'clearF': S.radar[t.dataset.k] = ''; render(); break;
    case 'clearAll': Object.assign(S.radar, {q:'',src:'',pri:'',st:'',person:'',tab:'all'}); render(); break;
    case 'goRadar': Object.assign(S.radar, {q:'',src:'',pri:t.dataset.pri||'',st:t.dataset.st||'',person:'',tab:t.dataset.tab||'all'}); location.hash = 'radar'; break;
    case 'searchRadar': Object.assign(S.radar, {q:t.dataset.q, tab:'all', src:'', pri:'', st:'', person:''}); if (S.route==='radar') render(); else location.hash = 'radar'; break;
    case 'goto': closeLayer(); location.hash = t.dataset.to; break;
    case 'goTeam': S.team.health = t.dataset.h; location.hash = 'team'; break;
    case 'member': lastFocus = t; memberModal(t.dataset.pid); break;
    case 'teamH': S.team.health = S.team.health===t.dataset.h ? '' : t.dataset.h; render(); break;
    case 'teamClear': S.team = {health:'',team:'',view:'cards'}; render(); break;
    case 'logTab': S.logTab = t.dataset.v; render(); break;
    case 'setTab': S.setTab = t.dataset.v; render(); break;
    case 'theme': cycleTheme(); break;
    case 'setTheme': setTheme(t.dataset.v); break;
    case 'bell': Object.assign(S.radar, {q:'',src:'',pri:'P1',st:'',person:'',tab:'all'}); location.hash = 'radar'; if (S.route==='radar') render(); break;
    case 'aiBrief': aiBrief(); break;
    case 'aiNotes': aiNotes(id); break;
    case 'thumb': toast('Thanks · feedback helps tune your brief'); break;
    case 'calDay': if (S.route==='calendar'){ S.calSel = t.dataset.cal; render(); } else calPopover(t, t.dataset.cal); break;
    case 'calPrev': { let [y,m] = S.calMonth; m--; if (m<0){m=11;y--;} S.calMonth=[y,m]; render(); break; }
    case 'calNext': { let [y,m] = S.calMonth; m++; if (m>11){m=0;y++;} S.calMonth=[y,m]; render(); break; }
    case 'calToday': S.calMonth = [2026,9]; S.calSel = TODAY_KEY; render(); break;
    case 'copySlot': copy(`Does ${t.dataset.slot} work for you? (30 min)`, `Copied "${t.dataset.slot}" · paste it into your reply`); break;
    case 'copyGuide': copy(document.getElementById('guide-text').textContent, 'Team guide copied'); break;
    case 'integ': S.integ[t.dataset.k] = t.checked; persist(); render(); toast(`${SRC[t.dataset.k].name} sync ${t.checked?'resumed':'paused'} · history is kept`); break;
    case 'reconnect': if (t.dataset.k==='calendar') S.calAttention = false; if (t.dataset.k==='jira') S.simJira = false; S.log.unshift({t:nowT(),act:'reconnected',id:'',text:`Reconnected ${SRC[t.dataset.k].name}`}); render(); toast(`${SRC[t.dataset.k].name} reconnected · syncing now`); break;
    case 'manage': toast(`${SRC[t.dataset.k].name}: read-only access · ${t.dataset.k==='slack'?'2 channels excluded':'no exclusions'}`); break;

  }

    const rows = [...document.querySelectorAll('.radar-table .row')]; const i = rows.indexOf(document.activeElement);
    if (e.key==='j'){ (rows[i+1]||rows[0])?.focus(); }
    if (e.key==='k'){ (rows[i-1]||rows[0])?.focus(); }
    if (i>=0 && e.key==='e'){ const id = rows[i].dataset.id; const it = S.items.find(x=>x.id===id); setStatus(id,'done',{},`Marked done "${it.title}"`,'done'); }
    if (i>=0 && e.key==='o'){ sourceModal(rows[i].dataset.id); }
  }
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.theme==='system') render(); });

/* ---------- router ---------- */
const ROUTES = {dashboard:vDashboard, radar:vRadar, calendar:vCalendar, team:vTeam, activity:vActivity, happened:vHappened, integrations:vIntegrations, preferences:vPreferences};
function render(){
  renderSide(); renderTop();
  const scrollY = window.scrollY;
  document.getElementById('view').innerHTML = ROUTES[S.route]();
  window.scrollTo(0, scrollY);
}
function route(){
  const h = (location.hash||'').replace('#','');
  const next = ROUTES[h] ? h : 'dashboard';
  const changed = next !== S.route; S.route = next;
  if (next==='preferences' && S.setTab==='integrations') S.setTab = 'appearance';
  closeLayer(); document.querySelectorAll('.menu,.pop').forEach(m=>m.remove());
  render(); if (changed) window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
applyTheme(); route();
})();
</script>
